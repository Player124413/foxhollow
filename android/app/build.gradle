plugins {
    id 'com.android.application'
}
def repo = rootProject.projectDir.parentFile
def borealis = new File(repo, 'extern/borealis')
ext.borealisAndroid = [
    borealisDir: borealis,
    propertiesFile: new File(project.findProperty('nativeBuildDir') ?: new File(repo, 'build-android-arm64').path,
                             'borealis-android.properties'),
    namespace: 'dev.foxhollow',
    applicationId: 'dev.foxhollow',
    compileSdk: 35,
    targetSdk: 35,
    minSdk: 28
]
apply from: new File(borealis, 'platforms/android/gradle/borealis-application.gradle')

def signingPath = System.getenv('FOXHOLLOW_KEYSTORE_FILE')
def signingPassword = System.getenv('FOXHOLLOW_KEYSTORE_PASSWORD')
def buildNumber = System.getenv('FOXHOLLOW_BUILD_NUMBER')
if (System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('GITHUB_EVENT_NAME') != 'pull_request' && !signingPath) {
    throw new GradleException('FOXHOLLOW_SIGNING_SETUP_REQUIRED')
}

android {
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (buildNumber) versionCode 1000000000 + Integer.parseInt(buildNumber)
    }
    if (signingPath) {
        signingConfigs {
            persistent {
                storeFile file(signingPath)
                storeType 'PKCS12'
                storePassword signingPassword
                keyAlias System.getenv('FOXHOLLOW_KEYSTORE_ALIAS') ?: 'foxhollow'
                keyPassword signingPassword
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.persistent }
            release { signingConfig signingConfigs.persistent }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError true
        lintConfig file('lint.xml')
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
