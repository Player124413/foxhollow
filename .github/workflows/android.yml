name: Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'port/**'
      - 'src/**'
      - 'game/**'
      - 'extern/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'port/**'
      - 'src/**'
      - 'game/**'
      - 'extern/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  input-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests -B build-input-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-input-tests --parallel 2
      - run: ctest --test-dir build-input-tests --output-on-failure
  apk:
    needs: input-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' "ndk;$ANDROID_NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-android-arm64/_deps
          key: android-arm64-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'extern/aurora/cmake/AuroraDependencyVersions.cmake') }}
      - run: ./android/build-apk.sh arm64-v8a 2>&1 | tee android-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: foxhollow-android-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android-build.log
            build-android-arm64/CMakeFiles/CMakeConfigureLog.yaml
