name: Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'port/**'
      - 'src/**'
      - 'game/**'
      - 'extern/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'port/**'
      - 'src/**'
      - 'game/**'
      - 'extern/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  input-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S tests -B build-input-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-input-tests --parallel 2
      - run: ctest --test-dir build-input-tests --output-on-failure
  apk:
    needs: input-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      FOXHOLLOW_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: github.event_name != 'pull_request'
        env:
          FOXHOLLOW_ANDROID_SIGNING_BUNDLE: ${{ secrets.FOXHOLLOW_ANDROID_SIGNING_BUNDLE }}
        run: python3 android/prepare-signing.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION" 2>&1 | tee android-sdk.log'
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache/restore@v6
        id: deps
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-android-arm64/_deps
          key: android-arm64-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'extern/aurora/cmake/AuroraDependencyVersions.cmake') }}
      - run: ./android/build-apk.sh arm64-v8a 2>&1 | tee android-build.log
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: foxhollow-android-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/signing-certificate.txt
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/cache/save@v6
        if: always() && steps.deps.outcome == 'success' && steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-android-arm64/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - if: failure()
        run: python3 android/report-ci-failure.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android-build.log
            android-sdk.log
            build-android-arm64/CMakeFiles/CMakeConfigureLog.yaml
